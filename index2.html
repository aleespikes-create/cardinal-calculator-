<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Perch — Cardinal Finish Co.</title>
<link rel="icon" href="assets/mark-700.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cf-red:#C13A2A;
  --cf-red-dim:#A5311F;
  --cf-cream:#F7F3EE;
  --cf-cream-2:#F1ECE3;
  --cf-ink:#1A1A1A;
  --cf-ink-60:#5B5751;
  --cf-line:#E4DDD1;
  --cf-line-strong:#D2C8B6;
  --sem-danger:#8B1E1E;
  --sem-danger-bg:#F8E7E4;
  --sem-warn:#B8860B;
  --sem-warn-bg:#FBF1DC;
  --sem-info:#1F5673;
  --sem-info-bg:#E4EEF2;
  --sem-ok:#2E6B4F;
  --sem-ok-bg:#E5F0EA;
  --cf-slate:#2C3138;
  --cf-slate-2:#3A414A;
  --cf-white:#FFFFFF;
  --shadow-card:0 1px 2px rgba(26,26,26,.06), 0 6px 20px rgba(26,26,26,.05);
  --radius-s:6px;
  --radius-m:10px;
  --radius-l:16px;
  --font-head:'Archivo Narrow', sans-serif;
  --font-body:'Inter', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cf-cream);
  color:var(--cf-ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overscroll-behavior-y:none;
}
button, input, select, textarea{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-head); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:0;}
p{margin:0;}
a{color:inherit;}
::selection{background:var(--cf-red); color:#fff;}

#app{max-width:520px; margin:0 auto; min-height:100vh; background:var(--cf-cream); position:relative; display:flex; flex-direction:column;}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:14px 18px; background:rgba(247,243,238,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--cf-line);
}
.topbar .backbtn{
  width:36px; height:36px; border-radius:50%; border:1px solid var(--cf-line-strong);
  background:var(--cf-white); display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex:0 0 auto;
}
.topbar .backbtn svg{width:16px;height:16px;}
.topbar .titles{flex:1; min-width:0;}
.topbar .eyebrow{font-size:11px; color:var(--cf-ink-60); font-weight:600; letter-spacing:.06em; text-transform:uppercase;}
.topbar h1{font-size:19px; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topbar .brandmark{display:flex; align-items:center; gap:8px;}
.topbar .brandmark img{height:26px; width:auto;}
.topbar .privatebtn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--cf-slate); background:var(--cf-slate);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
}
.topbar .privatebtn svg{width:16px;height:16px; stroke:#fff;}

/* ---------- Screen container ---------- */
.screen{padding:18px 18px 24px; flex:1; display:flex; flex-direction:column; gap:16px;}
.screen.pad-bottom{padding-bottom:120px;}

/* ---------- Home ---------- */
.hero-home{
  padding:34px 22px 30px; background:var(--cf-ink); border-radius:var(--radius-l); color:var(--cf-cream);
  position:relative; overflow:hidden;
}
.hero-home .mark{width:54px; height:auto; margin-bottom:18px; filter:brightness(0) invert(1);}
.hero-home h1{font-size:34px; color:#fff; line-height:1.02; margin-bottom:8px;}
.hero-home p{font-size:14px; color:#D8D2C6; line-height:1.5; max-width:34ch;}
.hero-home .startbtn{
  margin-top:22px; display:inline-flex; align-items:center; gap:8px;
  background:var(--cf-red); color:#fff; border:none; border-radius:999px;
  padding:13px 22px; font-weight:700; font-size:15px; cursor:pointer;
}
.hero-home .startbtn svg{width:16px;height:16px;}
.section-label{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--cf-ink-60); padding:0 2px;}

.estimate-row{
  display:flex; align-items:center; gap:12px; background:var(--cf-white); border:1px solid var(--cf-line);
  border-radius:var(--radius-m); padding:14px 16px; cursor:pointer;
}
.estimate-row:active{background:var(--cf-cream-2);}
.estimate-row .initials{
  width:38px;height:38px;border-radius:50%;background:var(--cf-cream-2); color:var(--cf-ink);
  display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; flex:0 0 auto;
}
.estimate-row .info{flex:1; min-width:0;}
.estimate-row .name{font-weight:600; font-size:15px;}
.estimate-row .meta{font-size:12.5px; color:var(--cf-ink-60); margin-top:2px;}
.status-chip{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:4px 9px; border-radius:999px; flex:0 0 auto;}
.status-draft{background:#EFEAE0; color:var(--cf-ink-60);}
.status-presented{background:var(--sem-info-bg); color:var(--sem-info);}
.status-won{background:var(--sem-ok-bg); color:var(--sem-ok);}
.status-lost{background:var(--sem-danger-bg); color:var(--sem-danger);}
.status-expired{background:#EFEAE0; color:var(--cf-ink-60);}
.empty-state{
  text-align:center; padding:40px 20px; color:var(--cf-ink-60); font-size:13.5px; border:1px dashed var(--cf-line-strong);
  border-radius:var(--radius-m);
}

/* ---------- Cards / forms ---------- */
.card{background:var(--cf-white); border:1px solid var(--cf-line); border-radius:var(--radius-m); padding:18px; display:flex; flex-direction:column; gap:14px;}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12.5px; font-weight:600; color:var(--cf-ink-60);}
.field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=number], .field select, .field textarea{
  border:1px solid var(--cf-line-strong); border-radius:var(--radius-s); padding:12px 13px; font-size:17px; background:var(--cf-cream);
  color:var(--cf-ink); width:100%;
}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--cf-red); outline-offset:1px; background:#fff;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.helptext{font-size:12px; color:var(--cf-ink-60); line-height:1.4;}
.check-row{display:flex; align-items:center; gap:10px; padding:4px 0;}
.check-row input[type=checkbox]{width:20px;height:20px; accent-color:var(--cf-red);}
.check-row label{font-size:14px; font-weight:500;}

/* ---------- Buttons ---------- */
.btn{
  border:none; border-radius:999px; padding:14px 20px; font-weight:700; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn-primary{background:var(--cf-red); color:#fff;}
.btn-primary:active{background:var(--cf-red-dim);}
.btn-primary:disabled{background:#D9CFC2; color:#96897A; cursor:not-allowed;}
.btn-secondary{background:var(--cf-white); color:var(--cf-ink); border:1px solid var(--cf-line-strong);}
.btn-ghost{background:transparent; color:var(--cf-ink-60); border:none; text-decoration:underline; font-weight:600; padding:8px;}
.btn-danger{background:var(--sem-danger); color:#fff;}
.btn-slate{background:var(--cf-slate); color:#fff;}
.btn-sm{padding:9px 14px; font-size:13.5px; width:auto;}
.btn-icon{width:40px;height:40px; border-radius:50%; padding:0; flex:0 0 auto;}

/* ---------- Chips ---------- */
.chiprow{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1.5px solid var(--cf-line-strong); background:var(--cf-white); border-radius:999px; padding:9px 15px;
  font-size:13.5px; font-weight:600; cursor:pointer; color:var(--cf-ink); user-select:none;
}
.chip.selected{border-color:var(--cf-red); background:var(--cf-red); color:#fff;}
.chip.small{padding:6px 12px; font-size:12.5px;}
.tilebtn{
  border:1.5px solid var(--cf-line-strong); background:var(--cf-white); border-radius:var(--radius-m); padding:16px 10px;
  display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; text-align:center;
}
.tilebtn.selected{border-color:var(--cf-red); background:#FDF1EF;}
.tilebtn svg{width:24px;height:24px;}
.tilebtn .tlabel{font-size:12.5px; font-weight:700;}
.tilebtn .tsub{font-size:10.5px; color:var(--cf-ink-60);}

/* ---------- Stepper ---------- */
.stepper{display:flex; align-items:center; gap:0; border:1px solid var(--cf-line-strong); border-radius:999px; overflow:hidden; background:var(--cf-white);}
.stepper button{border:none; background:var(--cf-cream-2); width:38px; height:38px; font-size:18px; font-weight:700; cursor:pointer; color:var(--cf-ink);}
.stepper .val{min-width:34px; text-align:center; font-weight:700; font-size:15px;}
.surface-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--cf-line);}
.surface-row:last-child{border-bottom:none;}
.surface-row .slabel{font-size:14.5px; font-weight:600;}
.surface-row .ssub{font-size:11.5px; color:var(--cf-ink-60);}

/* ---------- Room list ---------- */
.room-card{background:var(--cf-white); border:1px solid var(--cf-line); border-radius:var(--radius-m); padding:15px 16px; display:flex; align-items:center; gap:12px; cursor:pointer;}
.room-card .ricon{width:40px;height:40px;border-radius:10px;background:var(--cf-cream-2); display:flex;align-items:center;justify-content:center; flex:0 0 auto;}
.room-card .ricon svg{width:20px;height:20px;}
.room-card .rinfo{flex:1; min-width:0;}
.room-card .rname{font-weight:700; font-size:15px;}
.room-card .rmeta{font-size:12px; color:var(--cf-ink-60); margin-top:2px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--cf-ink-60); display:inline-block;}
.preset-dot{width:6px;height:6px;border-radius:50%;background:var(--sem-warn); display:inline-block; margin-left:4px;}
.room-card .rprice{font-weight:700; font-size:14.5px; flex:0 0 auto;}
.room-card .chev{color:var(--cf-ink-60); flex:0 0 auto;}
.add-room-btn{
  border:2px dashed var(--cf-line-strong); background:transparent; border-radius:var(--radius-m); padding:16px;
  display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; color:var(--cf-red); cursor:pointer; font-size:14.5px;
}

/* ---------- Footer total bar ---------- */
.footerbar{
  position:sticky; bottom:0; z-index:30; background:var(--cf-ink); color:#fff;
  padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  box-shadow:0 -6px 18px rgba(0,0,0,.12);
}
.footerbar .fstats{display:flex; gap:16px; font-size:11.5px; color:#B9B2A4;}
.footerbar .fstats b{color:#fff; font-size:13px; display:block; font-family:var(--font-head);}
.footerbar .ftotal{font-family:var(--font-head); font-size:22px; font-weight:700;}
.footerbar .fcta{background:var(--cf-red); color:#fff; border:none; border-radius:999px; padding:11px 18px; font-weight:700; font-size:13.5px; cursor:pointer;}
.footerbar .fcta-icon{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;}
.footerbar .fcta-icon svg{width:16px; height:16px;}

/* ---------- Tabs ---------- */
.tabbar{display:flex; gap:6px; background:var(--cf-cream-2); border-radius:999px; padding:4px;}
.tabbar button{flex:1; border:none; background:transparent; padding:10px 8px; border-radius:999px; font-weight:700; font-size:13px; cursor:pointer; color:var(--cf-ink-60);}
.tabbar button.active{background:var(--cf-white); color:var(--cf-ink); box-shadow:var(--shadow-card);}

/* ---------- Banners / checks ---------- */
.banner{border-radius:var(--radius-m); padding:13px 15px; display:flex; gap:11px; align-items:flex-start; font-size:13.5px; line-height:1.45;}
.banner svg{width:18px;height:18px; flex:0 0 auto; margin-top:1px;}
.banner-danger{background:var(--sem-danger-bg); color:var(--sem-danger);}
.banner-warn{background:var(--sem-warn-bg); color:#7A5D06;}
.banner-info{background:var(--sem-info-bg); color:var(--sem-info);}
.banner-ok{background:var(--sem-ok-bg); color:var(--sem-ok);}
.banner b{font-weight:700;}
.check-list{display:flex; flex-direction:column; gap:8px;}
.checkrow{padding:12px 14px; border-radius:var(--radius-s); border:1px solid var(--cf-line);}
.checkrow.has-detail{border-color:var(--cf-line-strong); background:var(--cf-cream-2);}
.checkrow .crow-top{display:flex; align-items:center; gap:10px;}
.checkrow .cstatus{width:22px;height:22px;border-radius:50%; flex:0 0 auto; display:flex;align-items:center;justify-content:center;}
.checkrow .cstatus svg{width:12px;height:12px;}
.checkrow .ctext{flex:1; min-width:0;}
.checkrow .ctitle{font-size:13.5px; font-weight:700;}
.checkrow .cval{font-size:12px; color:var(--cf-ink-60); margin-top:1px;}
.csolutions{margin-top:10px; padding-top:10px; border-top:1px dashed var(--cf-line-strong);}
.csolutions-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--cf-ink-60); margin-bottom:6px;}
.csolutions ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px;}
.csolutions li{font-size:12.5px; line-height:1.45; color:var(--cf-ink);}
.csolutions-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.checkrow .cval{font-size:12px; color:var(--cf-ink-60); margin-top:1px;}
.cs-ok{background:var(--sem-ok);}
.cs-warn{background:var(--sem-warn);}
.cs-danger{background:var(--sem-danger);}
.cs-info{background:var(--sem-info);}

/* ---------- Tier cards ---------- */
.tier-tabs{display:flex; gap:8px;}
.tier-tab{flex:1; border:1.5px solid var(--cf-line-strong); background:var(--cf-white); border-radius:var(--radius-m); padding:14px 8px; text-align:center; cursor:pointer;}
.tier-tab.active{border-color:var(--cf-red); background:#FDF1EF;}
.tier-tab .tname{font-family:var(--font-head); font-weight:700; font-size:15px;}
.tier-tab .tprice{font-size:17px; font-weight:800; margin-top:4px;}
.tier-tab .tdelta{font-size:11px; color:var(--cf-ink-60); margin-top:2px;}
.margin-slider-wrap{display:flex; flex-direction:column; gap:8px;}
.margin-slider-wrap input[type=range]{width:100%; accent-color:var(--cf-red); height:30px;}
.gm-live{display:flex; justify-content:space-between; font-size:13px;}
.gm-live b{font-family:var(--font-head); font-size:20px;}

/* ---------- Line item breakdown ---------- */
.lineitem{display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--cf-line); gap:10px;}
.lineitem:last-child{border-bottom:none;}
.lineitem .lname{font-size:13.5px; font-weight:600;}
.lineitem .lqty{font-size:11.5px; color:var(--cf-ink-60);}
.lineitem .lprice{font-size:13.5px; font-weight:700; white-space:nowrap;}
.section-total{display:flex; justify-content:space-between; padding-top:10px; margin-top:4px; border-top:1.5px solid var(--cf-ink); font-weight:700; font-size:14.5px;}

/* ---------- Proposal ---------- */
.proposal-cover{background:var(--cf-ink); color:#fff; border-radius:var(--radius-l); padding:30px 24px; text-align:center;}
.proposal-cover img{height:44px; margin-bottom:14px; filter:brightness(0) invert(1);}
.proposal-cover h2{color:#fff; font-size:22px; margin-bottom:6px;}
.proposal-cover p{color:#C9C2B4; font-size:13px;}
.value-item{display:flex; gap:10px; align-items:flex-start; padding:8px 0;}
.value-item svg{width:17px; height:17px; color:var(--sem-ok); flex:0 0 auto; margin-top:2px;}
.value-item span{font-size:13.5px; line-height:1.4;}

/* ---------- Private surface ---------- */
.private-screen{background:var(--cf-slate); color:#fff; min-height:100vh;}
.private-screen .screen{padding-bottom:40px;}
.private-card{background:var(--cf-slate-2); border-radius:var(--radius-m); padding:16px 18px; border:1px solid #4A525C;}
.private-card .plabel{font-size:11.5px; color:#A8AFB8; font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
.private-card .pval{font-family:var(--font-head); font-size:24px; font-weight:700; margin-top:4px;}
.private-card .pval.small{font-size:17px;}
.priv-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #4A525C; font-size:13.5px;}
.priv-row:last-child{border-bottom:none;}
.priv-row .pk{color:#A8AFB8;}
.priv-row .pv{font-weight:700;}

/* ---------- Toggle switch ---------- */
.toggle{width:44px;height:26px;border-radius:999px;background:var(--cf-line-strong);position:relative;cursor:pointer; flex:0 0 auto;}
.toggle.on{background:var(--cf-red);}
.toggle .knob{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle.on .knob{left:21px;}

/* ---------- Misc ---------- */
.divider{height:1px; background:var(--cf-line); margin:2px 0;}
.modal-backdrop{position:fixed; inset:0; background:rgba(26,26,26,.55); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
.modal{background:#fff; border-radius:20px 20px 0 0; padding:24px 20px 30px; width:100%; max-width:520px; max-height:85vh; overflow-y:auto; display:flex; flex-direction:column; gap:14px;}
.modal h2{font-size:19px;}
.modal-close{position:absolute; top:16px; right:16px;}
.gate-icon{width:52px;height:52px; border-radius:50%; background:var(--sem-warn-bg); display:flex; align-items:center; justify-content:center; margin:0 auto;}
.gate-icon svg{width:26px;height:26px; color:var(--sem-warn);}
.taplog{font-size:11px; color:var(--cf-ink-60); text-align:center; padding-top:2px;}
::-webkit-scrollbar{width:0; height:0;}
@media print{
  body *{ visibility:hidden; }
  #proposal-print-area, #proposal-print-area *{ visibility:visible; }
  #proposal-print-area{ position:absolute; top:0; left:0; width:100%; padding:16px; }
  .no-print, .topbar, .footerbar{ display:none !important; }
  #app{ max-width:none; }
  .proposal-cover{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   PERCH — Cardinal Finish Co. field estimating engine
   Implements PRD v2.0 §4 (pricing architecture) and §5 (calibrated engine)
   ========================================================================= */

const ICONS = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v9"/><circle cx="12" cy="18" r=".8" fill="#fff" stroke="none"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v-4"/><circle cx="12" cy="8" r=".8" fill="#fff" stroke="none"/></svg>',
  bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a2 2 0 012-2h14a2 2 0 012 2v6M3 18v2M21 18v2M3 12V9a2 2 0 012-2h4a2 2 0 012 2v3"/></svg>',

/* -------------------------------------------------------------------------
   §4.2 Global engine constants (Settings-editable)

   RECALIBRATED (v3): $25/hr is a costing/estimating input only — it is
   NOT what field crews are literally paid per hour. Cardinal pays crews a
   flat percentage of the completed project price. Two reasons: (1) real
   market data for painting-subcontractor pay (ZipRecruiter: avg $21.82/hr,
   25th-75th pctile $17.55-$24.04/hr for "Painting Subcontractor" postings)
   sits far below this engine's original $50/hr assumption, which had no
   real validation behind it (flagged as OQ-6, the single highest-risk
   number in the original spec); (2) paying a "1099 sub" a straight hourly
   rate is a genuine IRS misclassification risk — a real subcontractor is
   supposed to carry profit-or-loss risk on the job, which a flat hourly
   wage doesn't provide. A flat percentage-of-project payout gives that
   real risk/reward and stays defensible. $25/hr here exists purely so the
   engine can turn a room/elevation/cabinet scope into an accurate hours
   estimate, which becomes job cost, which becomes price — the actual crew
   payout is computed as CREW payout $ ÷ retail, shown as a percentage
   throughout the app (Private screen, Sub Work Order), not as an hourly
   figure. CREW_DAY_FLOOR is kept at the same formula
   (PAINTER_HOURS_PER_CREW_DAY × the estimating rate) purely as a sanity
   check that the estimate assumes enough dollars per day of work to be
   worth doing — not a literal daily wage floor.

   Standard 50% gross margin (SOLO_JOB_MARGIN and every MARGIN_ANCHORS
   point) replaces the old sliding 56%→42% crew curve and the separate
   20% solo-visit margin: "50% gross profit is the standard," flat,
   program-wide, on every job size. Simpler to operate and explain than
   two different curves. Re-validate labor hours (§5.9) against real crew
   quotes before launch — the $25/hr estimating rate and the 50% margin
   are still the two least-validated numbers in this model. */
const CONSTANTS = {
  MATERIALS_TAX_RATE: 0.0975,
  SUNDRIES_PCT: 0.15,
  SUNDRIES_MIN: 75,
  OCCUPIED_PROTECTION_RATE: 0.06,
  MINIMUM_JOB: 650,
  SOLO_JOB_HOUR_THRESHOLD: 16,
  SOLO_JOB_MARGIN: 0.50,
  SOLO_MARGIN_HARD_FLOOR: 0.35,
  CREW_DAY_FLOOR: 400,
  PAINTER_HOURS_PER_CREW_DAY: 16,
  MARGIN_HARD_FLOOR: 0.35,
  MARGIN_OVERRIDE_RANGE: 0.06,
  TN_LICENSE_THRESHOLD: 25000,
  DUAL_METHOD_TOLERANCE: 0.12,
};

/* §4.3 Labor estimating rate. See CONSTANTS comment above: this is a
   costing input, not literal hourly crew pay. Interior and exterior share
   a flat $25/hr baseline. Cabinets is raised to $55/hr — flattening it to
   $25 priced cabinet work at ~$76/piece, well under the researched
   Franklin/Nashville market band of $140-190/piece; fine-finish spray
   work is scarcer-skill, less forgiving, and absorbs cure-day downtime,
   which is why it commands a real premium over wall painting. $55/hr
   lands cabinets around $150/piece, mid-band. */
const SUB_RATES = { interior: 25, exterior: 25, cabinets: 55 };

/* §4.4 Margin — flat 50% gross profit standard, every job size, every
   service line. Kept as an anchor-point array (rather than a single
   number) so the Settings console can still reintroduce a slope later
   without a code change — but every point is 50% by default. */
const MARGIN_ANCHORS = [[750,.50],[1750,.50],[3750,.50],[7000,.50],[12000,.50],[20000,.50]];
function marginFor(cost){
  if(cost<=MARGIN_ANCHORS[0][0]) return MARGIN_ANCHORS[0][1];
  const last = MARGIN_ANCHORS[MARGIN_ANCHORS.length-1];
  if(cost>=last[0]) return last[1];
  for(let i=0;i<MARGIN_ANCHORS.length-1;i++){
    const [c0,m0]=MARGIN_ANCHORS[i], [c1,m1]=MARGIN_ANCHORS[i+1];
    if(cost>=c0 && cost<=c1) return m0+(m1-m0)*(cost-c0)/(c1-c0);
  }
}

/* -------------------------------------------------------------------------
   §7.9 Settings console — every value above is Settings-editable.
   DEFAULTS is a frozen snapshot for "restore defaults"; edits mutate the
   live CONSTANTS/SUB_RATES/MARGIN_ANCHORS objects in place so every part of
   the engine that already closed over them picks up the change immediately.
   ------------------------------------------------------------------------- */
const DEFAULTS = {
  CONSTANTS: JSON.parse(JSON.stringify(CONSTANTS)),
  SUB_RATES: JSON.parse(JSON.stringify(SUB_RATES)),
  MARGIN_ANCHORS: JSON.parse(JSON.stringify(MARGIN_ANCHORS)),
};
function applySettingsPatch(patch){
  Object.assign(CONSTANTS, patch.CONSTANTS);
  Object.assign(SUB_RATES, patch.SUB_RATES);
  if(patch.MARGIN_ANCHORS){
    patch.MARGIN_ANCHORS.forEach((pair,i)=>{ if(MARGIN_ANCHORS[i]) MARGIN_ANCHORS[i][1] = pair[1]; });
  }
}
function restoreDefaults(){
  Object.assign(CONSTANTS, JSON.parse(JSON.stringify(DEFAULTS.CONSTANTS)));
  Object.assign(SUB_RATES, JSON.parse(JSON.stringify(DEFAULTS.SUB_RATES)));
  DEFAULTS.MARGIN_ANCHORS.forEach((pair,i)=>{ MARGIN_ANCHORS[i][1] = pair[1]; });
}
async function persistSettings(){
  try{
    if(window.storage){
      await window.storage.set('perch:settings', JSON.stringify({ CONSTANTS, SUB_RATES, MARGIN_ANCHORS }));
    }
  }catch(err){ /* session-only fallback */ }
}
async function loadSettings(){
  try{
    if(window.storage){
      const res = await window.storage.get('perch:settings');
      if(res && res.value){ applySettingsPatch(JSON.parse(res.value)); }
    }
  }catch(err){ /* use defaults */ }
}

/* Re-runs the Appendix A acceptance fixture (Franklin two-story interior,
   6 rooms + hall/stairs, ~2700 sqft) against whatever CONSTANTS/SUB_RATES/
   MARGIN_ANCHORS are currently live, so a Settings change can be checked
   before saving. Expected value reflects the v3 recalibration: $25/hr
   estimating rate, flat 50% margin -> $9,450. Prior calibrations for
   reference: v1 launch $13,150 at 47% GM ($50/hr); v2 $11,400 at 39% GM
   ($50/hr, sliding 50%->34% curve). Each rate/margin combination moves
   this fixture — that's expected, not a bug; the pass/fail band just
   confirms a Settings edit didn't move it further than intended. */
function runFixtureCheck(){
  const wallsHrs = 3700*(2/190)*1.15;
  const foyerHrs = 400*(2/190)*1.15*1.35;
  const ceilHrs = 1750*(2/245)*1.15;
  const baseHrs = 610*(2/128)*1.15;
  const doorHrs = 14*1.00*1.15;
  const jobBaseHours = wallsHrs+foyerHrs+ceilHrs+baseHrs+doorHrs;
  const eff = efficiencyFor(jobBaseHours);
  const subHours = jobBaseHours*eff;
  const subLabor = subHours*SUB_RATES.interior;
  const paintCost = 27*PAINT_CATALOG.wall.better.cost + 10*PAINT_CATALOG.ceiling.cost + 5*PAINT_CATALOG.trim.better.cost + 2*PAINT_CATALOG.primer.cost;
  const sundries = Math.max(CONSTANTS.SUNDRIES_PCT*paintCost, CONSTANTS.SUNDRIES_MIN);
  const occProtect = CONSTANTS.OCCUPIED_PROTECTION_RATE*2700;
  const materialsCost = (paintCost+sundries+occProtect)*(1+CONSTANTS.MATERIALS_TAX_RATE);
  const jobCost = subLabor+materialsCost;
  const m = marginFor(jobCost);
  const retail = roundPrice(jobCost/(1-m));
  const pass = Math.abs(retail-9450) <= 400; // tolerance band for a Settings-console check
  return { retail, expected:9450, pass };
}

/* §5.5 Job-size efficiency factor — interpolated at band midpoints */
const EFF_POINTS = [[8,1.15],[28,1.06],[60,1.00],[120,0.90],[200,0.84]];
function efficiencyFor(hours){
  if(hours<=EFF_POINTS[0][0]) return EFF_POINTS[0][1];
  const last = EFF_POINTS[EFF_POINTS.length-1];
  if(hours>=last[0]) return last[1];
  for(let i=0;i<EFF_POINTS.length-1;i++){
    const [h0,e0]=EFF_POINTS[i], [h1,e1]=EFF_POINTS[i+1];
    if(hours>=h0 && hours<=h1) return e0+(e1-e0)*(hours-h0)/(h1-h0);
  }
}

/* §4.5 Rounding */
function roundPrice(amount){
  if(amount<5000) return Math.round(amount/25)*25;
  if(amount<=15000) return Math.round(amount/50)*50;
  return Math.round(amount/100)*100;
}
function money(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
function money2(n){ return '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }

/* §5.7 Modifiers — multiplicative on labor, capped at 2.10 (product) */
const MODIFIERS = {
  condition: { excellent:0.92, standard:1.00, fair:1.15, poor:1.35, severe:1.60 },
  height: { '9':1.00, '10':1.08, '11-12':1.18, '13+':1.35 },
  colorChange: { same:1.00, standard:1.08, drastic:1.18 },
  occupancy: { vacant:0.93, occupied:1.00, occupied_heavy:1.10 },
  extAccess: { easy:1.00, steep:1.12, lift:1.25 },
  extStory: { '1':1.00, '2':1.18, '3':1.32 },
  wetArea: 1.10,
  accentWall: 1.25,
};
const MOD_CAP = 2.10;

function computeRoomModifierProduct(room){
  let p = MODIFIERS.condition[room.condition] * MODIFIERS.height[room.height] * MODIFIERS.colorChange[room.colorChange] * MODIFIERS.occupancy[room.occupancy];
  if(room.wet) p *= MODIFIERS.wetArea;
  return Math.min(p, MOD_CAP);
}

/* -------------------------------------------------------------------------
   Room geometry + hours (§4.1.1 measurement conventions, §5.4 rates)
   ------------------------------------------------------------------------- */
function roomGeometry(room){
  const [L,W,H] = room.dims;
  const perimeter = 2*(L+W);
  const grossWall = perimeter*H;
  const doorDeduct = room.doors*OPENING.interiorDoor;
  const windowDeduct = room.windows*OPENING.window;
  let netWall = Math.max(0, grossWall - doorDeduct - windowDeduct);
  const floorArea = L*W;
  const ceilingArea = room.vaulted ? floorArea*1.15 : floorArea;
  const baseboardLen = room.baseboard ? Math.max(0, perimeter - room.doors*2.75) : 0;
  const crownLen = room.crown ? perimeter : 0;
  return { perimeter, grossWall, netWall, floorArea, ceilingArea, baseboardLen, crownLen };
}

function computeRoomLines(room, tier){
  const geo = roomGeometry(room);
  const modProduct = computeRoomModifierProduct(room);
  const texRate = room.texture==='smooth'?RATES.wallsSmooth: room.texture==='light'?RATES.wallsLight:RATES.wallsHeavy;
  // §4.6 — tiers are re-priced scope configurations, not a flat multiplier on Better.
  // Best adds a real third coat on drastic color-change rooms (the coat is genuinely painted,
  // just not billed as a change order). Caulk scope shifts baseboard/crown labor: Good caulks
  // gaps only, Better is full trim caulk, Best adds nail-hole fill and sand.
  const coats = (tier==='best' && room.colorChange==='drastic') ? 3 : 2;
  const caulkMult = tier==='good' ? 0.90 : (tier==='best' ? 1.03 : 1.00);
  // Good's prep cap (patching beyond 4hr billed T&M, gap-only caulk) folds less finish labor
  // into the coat itself; Best's allowance folds more in. Applied to field surfaces only.
  const prepMult = tier==='good' ? 0.86 : 1.00;
  const lines = [];

  let wallArea = geo.netWall;
  // Accent wall: treat as a flagged fraction of wall area (~1 wall of 4) getting +25% labor
  const hasAccent = !!room.accentWall;
  const accentFraction = hasAccent ? 0.28 : 0;
  const baseWallHours = wallArea*(coats/texRate);
  let wallHours;
  if(room.vacantSpray && room.occupancy==='vacant'){
    wallHours = wallArea*(coats/RATES.wallsSpray)*modProduct*prepMult;
  } else {
    const normalPortion = baseWallHours*(1-accentFraction);
    const accentPortion = baseWallHours*accentFraction*MODIFIERS.accentWall;
    wallHours = (normalPortion+accentPortion)*modProduct*prepMult;
  }
  if(wallArea>0) lines.push({key:'walls', label:`Walls — ${room.texture} texture${coats===3?' (3 coats, drastic change)':''}`, qty:`${Math.round(wallArea)} sq ft`, hours:wallHours});

  if(room.ceiling && geo.ceilingArea>0){
    const cRate = room.vaulted?RATES.ceilingVaulted:RATES.ceilingFlat;
    const cHours = geo.ceilingArea*(2/cRate)*modProduct*prepMult;
    lines.push({key:'ceiling', label: room.vaulted?'Ceiling — vaulted':'Ceiling — flat', qty:`${Math.round(geo.ceilingArea)} sq ft`, hours:cHours});
  }
  if(room.baseboard && geo.baseboardLen>0){
    const h = geo.baseboardLen*(2/RATES.baseboard)*modProduct*caulkMult;
    lines.push({key:'baseboard', label:'Baseboard', qty:`${Math.round(geo.baseboardLen)} lnft`, hours:h});
  }
  if(room.crown && geo.crownLen>0){
    const h = geo.crownLen*(2/RATES.crown)*modProduct*caulkMult;
    lines.push({key:'crown', label:'Crown molding', qty:`${Math.round(geo.crownLen)} lnft`, hours:h});
  }
  if(room.doors>0){
    const h = room.doors*DISCRETE.doorBoth*modProduct;
    lines.push({key:'doors', label:'Interior doors, both sides', qty:`${room.doors} ea`, hours:h});
  }
  if(room.windows>0){
    const h = room.windows*DISCRETE.windowCasing*modProduct;
    lines.push({key:'windows', label:'Window casing', qty:`${room.windows} ea`, hours:h});
  }
  if(room.closet==='reachin'){
    const h = DISCRETE.closetReachIn*modProduct;
    lines.push({key:'closet', label:'Closet — reach-in', qty:'1 ea', hours:h});
  } else if(room.closet==='walkin'){
    const h = DISCRETE.closetWalkIn*modProduct;
    lines.push({key:'closet', label:'Closet — walk-in', qty:'1 ea', hours:h});
  }
  if(room.hasStairs){
    const h = DISCRETE.stairFlight*modProduct;
    lines.push({key:'stairs', label:'Stair flight', qty:'1 ea', hours:h});
  }
  return { lines, geo, modProduct, coats };
}


function roomMaterials(room, tier){
  const geo = roomGeometry(room);
  const coats = (tier==='best' && room.colorChange==='drastic') ? 3 : 2;
  const wallProduct = PAINT_CATALOG.wall[tier];
  const trimProduct = PAINT_CATALOG.trim[tier];
  const cov = COVERAGE[room.texture];
  let gallons = 0;
  const items = [];
  if(geo.netWall>0){
    const g = geo.netWall*coats/cov;
    gallons += g;
    items.push({name:wallProduct.name, gallons:g, cost:wallProduct.cost});
  }
  if(room.ceiling && geo.ceilingArea>0){
    const g = geo.ceilingArea*2/COVERAGE.smooth;
    items.push({name:PAINT_CATALOG.ceiling.name, gallons:g, cost:PAINT_CATALOG.ceiling.cost});
  }
  const trimUnits = (room.doors*1 + room.windows*0.3 + (room.baseboard?geo.baseboardLen/60:0) + (room.crown?geo.crownLen/60:0));
  if(trimUnits>0){
    const g = trimUnits*2/12; // approx gallons for discrete trim scope
    items.push({name:trimProduct.name, gallons:g, cost:trimProduct.cost});
  }
  let paintCost = 0;
  items.forEach(it=>{ const g = Math.max(0.05, it.gallons); paintCost += g*it.cost; });
  return { paintCost, items };
}

   ------------------------------------------------------------------------- */
const SUBSTRATES = ['fiberCement','wood','stucco','vinyl','brick'];
const SUBSTRATE_LABEL = { fiberCement:'Fiber cement / Hardie', wood:'Wood siding', stucco:'Stucco', vinyl:'Vinyl', brick:'Brick' };
const SUBSTRATE_EXT_CATEGORY = { fiberCement:'smooth', wood:'wood', stucco:'masonry', vinyl:'smooth', brick:'masonry' };

function elevationBodyRatePerSqft(){
  // wash + mask + caulk/prime + apply(2 coats @ smooth default) per §Appendix B-1 method
  return 0.0025 + 0.005 + 0.00333 + (2/300);
}
function elevationArea(elev){
  // A report-measured area (from an EagleView/HOVER PDF) is already the true
  // wall surface across however many stories — use it directly rather than
  // recomputing from length x height.
  return elev.areaOverride!=null ? elev.areaOverride : elev.length*elev.height;
}
function computeElevationHours(elev, tier){
  const area = elevationArea(elev);
  const storyMult = MODIFIERS.extStory[elev.stories];
  const accessMult = MODIFIERS.extAccess[elev.access];
  const condMult = MODIFIERS.condition[elev.condition];
  const bodyRate = elevationBodyRatePerSqft();
  const hours = area*bodyRate*storyMult*accessMult*condMult;
  return { hours, area };
}
function elevationMaterials(elev, tier){
  const area = elevationArea(elev);
  const cat = SUBSTRATE_EXT_CATEGORY[elev.substrate];
  const cov = EXT_COVERAGE[cat];
  const product = PAINT_CATALOG.extBody[tier];
  const gallons = Math.max(0.1, area*2/cov);
  return gallons*product.cost;
}

/* Exterior job-level components */
const EXT_COMPONENT_DEFS = [
  { key:'fascia', label:'Fascia + soffit', unit:'lnft', rateHours: (q)=>q/RATES.fasciaSoffit, matGal:(q)=>q*0.02 },
  { key:'gutters', label:'Gutters + downspouts', unit:'lnft', rateHours:(q)=>q/RATES.gutters, matGal:(q)=>q*0.015 },
  { key:'shutterPairs', label:'Shutters', unit:'pairs', rateHours:(q)=>q*DISCRETE.shutterPair, matGal:(q)=>q*0.15 },
  { key:'frontDoors', label:'Front door, fine finish', unit:'ea', rateHours:(q)=>q*DISCRETE.frontDoor, matGal:(q)=>q*0.3 },
  { key:'garageSingle', label:'Garage door, single', unit:'ea', rateHours:(q)=>q*DISCRETE.garageSingle, matGal:(q)=>q*0.2 },
  { key:'garageDouble', label:'Garage door, double', unit:'ea', rateHours:(q)=>q*DISCRETE.garageDouble, matGal:(q)=>q*0.3 },
  { key:'deck', label:'Deck / porch floor', unit:'sq ft', rateHours:(q)=>q/RATES.deckFloor, matGal:(q)=>q/200 },
  { key:'railing', label:'Railing', unit:'lnft', rateHours:(q)=>q/RATES.railing, matGal:(q)=>q*0.03 },
];

/* -------------------------------------------------------------------------
   Cabinets
   ------------------------------------------------------------------------- */
function computeCabinetHours(cab, tier){
  let hours = cab.doors*DISCRETE.cabDoor + cab.drawers*DISCRETE.cabDrawer + cab.openings*DISCRETE.cabBox +
              cab.panels*DISCRETE.cabIsland + cab.shelves*DISCRETE.cabShelf + DISCRETE.cabDegrease + cab.hardware*DISCRETE.cabHardware;
  if(cab.boxInteriors) hours += cab.openings*DISCRETE.cabBoxInterior;
  let surchargeMult = 1.0;
  if(cab.oak) surchargeMult += 0.20;
  if(cab.twoTone) surchargeMult += 0.10;
  if(cab.darkLight) surchargeMult += 0.10;
  if(cab.finishLocation==='onsite') surchargeMult += 0.08;
  hours = hours*surchargeMult;
  return hours;
}
function cabinetMaterials(cab){
  const primerGal = Math.max(0.3, (cab.doors+cab.drawers+cab.openings)/60);
  const coatGal = Math.max(0.5, (cab.doors+cab.drawers+cab.openings)/40);
  return primerGal*PAINT_CATALOG.cabPrimer.cost + coatGal*PAINT_CATALOG.cabCoating.cost;
}

/* -------------------------------------------------------------------------
   Full job computation
   ------------------------------------------------------------------------- */
function computeService(serviceKey, est, tier, forcedEff){
  if(serviceKey==='interior'){
    let baseHours=0, paintCost=0, allLines=[];
    est.rooms.forEach(room=>{
      const {lines} = computeRoomLines(room, tier);
      const rh = lines.reduce((s,l)=>s+l.hours,0);
      baseHours += rh;
      const mat = roomMaterials(room, tier);
      paintCost += mat.paintCost;
      allLines.push({room, lines, hours:rh});
    });
    // Best tier — §4.6: standard prep + 6 hr patch allowance included, job-wide.
    let allowanceHours = 0;
    if(tier==='best' && est.rooms.length>0){ allowanceHours = 4; baseHours += allowanceHours; }
    const eff = forcedEff!=null ? forcedEff : efficiencyFor(baseHours);
    const subHours = baseHours*eff;
    const subLabor = subHours*SUB_RATES.interior;
    const primerGal = Math.max(est.rooms.length*0.15, 0.5);
    paintCost += primerGal*PAINT_CATALOG.primer.cost;
    return { key:'interior', label:'Interior', baseHours, eff, subHours, subLabor, paintCost, lines:allLines, allowanceHours, rate:SUB_RATES.interior };
  }
  if(serviceKey==='exterior'){
    let baseHours=0, paintCost=0, elevLines=[];
    est.elevations.filter(e=>e.active).forEach(elev=>{
      const {hours, area} = computeElevationHours(elev, tier);
      baseHours += hours;
      paintCost += elevationMaterials(elev, tier);
      elevLines.push({elev, hours, area});
    });
    const compLines = [];
    EXT_COMPONENT_DEFS.forEach(def=>{
      const q = est.extComponents[def.key]||0;
      if(q>0){
        const h = def.rateHours(q);
        baseHours += h;
        const matCost = def.matGal(q)*54;
        paintCost += matCost;
        compLines.push({def, q, hours:h});
      }
    });
    const eff = forcedEff!=null ? forcedEff : efficiencyFor(baseHours);
    const subHours = baseHours*eff;
    const subLabor = subHours*SUB_RATES.exterior;
    paintCost += 2*PAINT_CATALOG.masonryPrimer.cost;
    return { key:'exterior', label:'Exterior', baseHours, eff, subHours, subLabor, paintCost, elevLines, compLines, rate:SUB_RATES.exterior };
  }
  if(serviceKey==='cabinets'){
    const cab = est.cabinets;
    const baseHours = computeCabinetHours(cab, tier);
    // Cabinets keep the <16hr solo-visit treatment (forcedEff, set by
    // pricingForServices) but never get the >60hr crew-mobilization VOLUME
    // BONUS that interior/exterior get — that discount models a crew
    // finding its rhythm across rooms/days, which doesn't apply to
    // repetitive piece-work spraying doors. Floored at 1.0 so a big kitchen
    // can't price itself below the researched $140-190/piece band.
    const eff = forcedEff!=null ? forcedEff : Math.max(1.0, efficiencyFor(baseHours));
    const subHours = baseHours*eff;
    const subLabor = subHours*SUB_RATES.cabinets;
    const paintCost = cabinetMaterials(cab);
    return { key:'cabinets', label:'Cabinets', baseHours, eff, subHours, subLabor, paintCost, cab, rate:SUB_RATES.cabinets };
  }
}

function pricingForServices(est, serviceKeys, tier, marginOverridePts){
  // Peek at total base hours first (cheap — hours don't depend on efficiency)
  // to decide solo-visit vs. crew-deployment pricing lane. See CONSTANTS comment.
  const preview = serviceKeys.map(k=>computeService(k, est, tier));
  const totalBaseHours = preview.reduce((s,x)=>s+x.baseHours,0);
  const soloMode = totalBaseHours>0 && totalBaseHours < CONSTANTS.SOLO_JOB_HOUR_THRESHOLD;
  const services = soloMode ? serviceKeys.map(k=>computeService(k, est, tier, 1.00)) : preview;

  const subLabor = services.reduce((s,x)=>s+x.subLabor,0);
  const paintCost = services.reduce((s,x)=>s+x.paintCost,0);
  const sundries = Math.max(CONSTANTS.SUNDRIES_PCT*paintCost, CONSTANTS.SUNDRIES_MIN);
  const floorArea = est.rooms.reduce((s,r)=>s+r.dims[0]*r.dims[1],0);
  const occupiedProtection = est.globals.occupancy!=='vacant' && serviceKeys.includes('interior') ? CONSTANTS.OCCUPIED_PROTECTION_RATE*floorArea : 0;
  const materialsSubtotal = paintCost+sundries+occupiedProtection;
  const materialsCost = materialsSubtotal*(1+CONSTANTS.MATERIALS_TAX_RATE);
  const rrpLine = est.rrpRequired ? (serviceKeys.includes('exterior')?850:485) : 0;
  const jobCost = subLabor + materialsCost + rrpLine;
  let m = soloMode ? CONSTANTS.SOLO_JOB_MARGIN : marginFor(jobCost);
  if(marginOverridePts) m = Math.max(0.05, Math.min(0.75, m + marginOverridePts/100));
  const retailRaw = jobCost/(1-m);
  const retail = roundPrice(Math.max(retailRaw, CONSTANTS.MINIMUM_JOB));
  const billableCrewDays = subLabor>0 ? (services.reduce((s,x)=>s+x.subHours,0))/CONSTANTS.PAINTER_HOURS_PER_CREW_DAY : 0;
  const cureDays = serviceKeys.includes('cabinets') ? 2 : 0;
  const calendarCrewDays = billableCrewDays + cureDays;
  return { services, subLabor, materialsCost, paintCost, sundries, occupiedProtection, rrpLine, jobCost, margin:m, retailRaw, retail, billableCrewDays, calendarCrewDays, soloMode, totalBaseHours };
}

/* -------------------------------------------------------------------------
   §4.7 Validation checks
   ------------------------------------------------------------------------- */
function runChecks(est, pricing, serviceKeys){
  const checks = [];
  const { retail, jobCost, margin, subLabor, materialsCost, billableCrewDays, calendarCrewDays } = pricing;

  // 1 — dual method
  const loadedDayRate = serviceKeys.reduce((s,k)=>s+SUB_RATES[k],0)/serviceKeys.length * CONSTANTS.PAINTER_HOURS_PER_CREW_DAY;
  const crewDayGut = billableCrewDays * loadedDayRate / (1-margin);
  const divergence = retail>0 ? Math.abs(retail-crewDayGut)/retail : 0;
  const c1warn = divergence>CONSTANTS.DUAL_METHOD_TOLERANCE;
  checks.push({ id:1, title:'Dual-method agreement', value:`Unit rollup ${money(retail)} vs. crew-day check ${money(crewDayGut)} — ${(divergence*100).toFixed(1)}% apart`,
    status: c1warn ? 'warn':'ok',
    solutions: c1warn ? ['Re-check room or elevation measurements for typos', 'Look for an unusually high modifier stack (condition × height × color can compound fast)', 'If this fires often across jobs, the loaded day-rate assumption may need recalibration in Settings'] : [] });

  // 2 — market band (simplified, per §5.8)
  if(serviceKeys.includes('interior') && est.rooms.length){
    const netWallTotal = est.rooms.reduce((s,r)=>s+roomGeometry(r).netWall,0);
    const interiorRetailShare = pricing.services.find(s=>s.key==='interior') ?
      (pricing.services.find(s=>s.key==='interior').subLabor + pricing.services.find(s=>s.key==='interior').paintCost*(1+CONSTANTS.MATERIALS_TAX_RATE))/(1-margin) : 0;
    const perSqft = netWallTotal>0 ? interiorRetailShare/netWallTotal : 0;
    const inBand = perSqft>=2.75*0.85 && perSqft<=3.60*1.15; // some tolerance since this is a simplified normalization
    const high = perSqft > 3.60*1.15;
    checks.push({ id:2, title:'Interior blended $/sq ft', value:`${money2(perSqft)} /sq ft net wall vs. $2.75–$3.60 band`, status: inBand?'ok':'warn',
      solutions: inBand ? [] : (high ? ['Check texture and condition are set correctly — Heavy texture and Poor/Severe condition both push this up fast', 'A high room count of small rooms (more trim and doors per sq ft of wall) naturally runs above a whole-home blend', 'If this is consistently high across jobs, the interior production rates may need recalibration in Settings'] : ['Confirm surfaces (ceiling, baseboard, crown) are toggled on where they should be', 'Check the wall texture default matches what this home actually has']) });
  }
  if(serviceKeys.includes('exterior')){
    const extService = pricing.services.find(s=>s.key==='exterior');
    const paintableArea = est.elevations.filter(e=>e.active).reduce((s,e)=>s+e.length*e.height,0);
    const bodyRetail = extService ? (extService.subLabor + extService.paintCost*(1+CONSTANTS.MATERIALS_TAX_RATE))/(1-margin) : 0;
    const perSqft = paintableArea>0 ? bodyRetail/paintableArea : 0;
    const inBand = perSqft>=2.50*0.85 && perSqft<=3.75*1.15;
    checks.push({ id:'2b', title:'Exterior body $/sq ft', value:`${money2(perSqft)} /sq ft paintable siding vs. $2.50–$3.75 band`, status: inBand?'ok':'warn',
      solutions: inBand ? [] : ['Double-check elevation length × height and substrate for each wall', 'Story multiplier and access (lift) modifiers both compound quickly on smaller homes', 'If this is consistently off, the exterior body rate may need recalibration in Settings'] });
  }
  if(serviceKeys.includes('cabinets')){
    const cabService = pricing.services.find(s=>s.key==='cabinets');
    const pieces = est.cabinets.doors+est.cabinets.drawers;
    const cabRetail = cabService ? (cabService.subLabor + cabService.paintCost*(1+CONSTANTS.MATERIALS_TAX_RATE))/(1-margin) : 0;
    const perPiece = pieces>0 ? cabRetail/pieces : 0;
    const inBand = perPiece>=140*0.85 && perPiece<=190*1.15;
    checks.push({ id:'2c', title:'Cabinets $/piece', value:`${money(perPiece)} /piece vs. $140–$190 band`, status: inBand?'ok':'warn',
      solutions: inBand ? [] : ['Check door and drawer counts against the actual kitchen', 'Oak grain-fill, two-tone, and on-site surcharges stack — confirm only the ones that really apply are checked'] });
  }

  // 3 — revenue per crew day (not meaningful for a solo visit — see check 4)
  const revPerDay = billableCrewDays>0 ? retail/billableCrewDays : 0;
  const c3warn = !pricing.soloMode && (revPerDay<1400||revPerDay>3200) && billableCrewDays>0;
  if(pricing.soloMode){
    checks.push({ id:3, title:'Revenue per crew-day', value:`Solo visit (${pricing.totalBaseHours.toFixed(1)} hrs) — the crew-day metric doesn't apply; see the solo-visit payout below instead`, status:'ok', solutions:[] });
  } else {
    checks.push({ id:3, title:'Revenue per crew-day', value:`${money(revPerDay)} vs. $1,400–$3,200`,
      status: c3warn ? 'warn':'ok',
      solutions: c3warn ? (revPerDay<1400 ? ['Add more scope so the crew\u2019s day is fully loaded', 'Check whether this job is being priced as a small, inefficient scope — see the small-job advisory below'] : ['Confirm the room/elevation count and modifiers are accurate — this may just be a large, efficient job, which is a good thing']) : [] });
  }

  // 4 — crew day floor (billable) — only meaningful when a full sub crew is being deployed
  const payoutPerDay = billableCrewDays>0 ? subLabor/billableCrewDays : 0;
  const c4danger = !pricing.soloMode && billableCrewDays>0 && payoutPerDay<CONSTANTS.CREW_DAY_FLOOR;
  if(pricing.soloMode){
    const soloPayout = subLabor;
    checks.push({ id:4, title:'Solo-visit payout', value:`${money(soloPayout)} for ${pricing.totalBaseHours.toFixed(1)} hrs at $${SUB_RATES.interior}/hr estimating rate — priced as a solo visit, not a 2-person crew deployment, so the ${money(CONSTANTS.CREW_DAY_FLOOR)}/crew-day floor doesn't apply`,
      status:'ok', solutions:[] });
  } else {
    checks.push({ id:4, title:'Crew-day floor (billable)', value:`${money(payoutPerDay)} vs. ${money(CONSTANTS.CREW_DAY_FLOOR)} floor — ${payoutPerDay<CONSTANTS.CREW_DAY_FLOOR?'this job will be hard to staff':'clears the floor'}`,
      status: c4danger ? 'danger':'ok',
      solutions: c4danger ? ['Add another room or more scope to reach an efficient job size', 'Raise the margin on the proposal screen for this job', 'Decline this job as scoped, or refer it to another company — it will be hard to staff profitably at this price'] : [],
      actions: c4danger ? [{label:'+ Add a room', action:'add-room'},{label:'Adjust margin', action:'goto-proposal'}] : [] });
  }

  // 4b — calendar utilization
  const payoutPerCalDay = calendarCrewDays>0 ? subLabor/calendarCrewDays : 0;
  if(serviceKeys.includes('cabinets')){
    checks.push({ id:'4b', title:'Calendar utilization (advisory)', value:`${money(payoutPerCalDay)} vs. ${money(CONSTANTS.CREW_DAY_FLOOR)} — cabinet crews batch parallel kitchens to absorb cure days`,
      status: payoutPerCalDay<CONSTANTS.CREW_DAY_FLOOR ? 'warn':'ok',
      solutions: payoutPerCalDay<CONSTANTS.CREW_DAY_FLOOR ? ['Expected on cabinet jobs — schedule this crew on a second kitchen during the cure days so the calendar time isn\u2019t idle'] : [] });
  }

  // 5 — cost structure sanity (bands recalibrated for the $25/hr estimating rate —
  // crew payout naturally runs lower as a % of retail than the old $50/hr basis did)
  const laborPct = retail>0 ? subLabor/retail : 0;
  const matPct = retail>0 ? materialsCost/retail : 0;
  const matBandLow = serviceKeys.includes('cabinets') && serviceKeys.length===1 ? 0.06 : 0.15;
  const matBandHigh = serviceKeys.includes('cabinets') && serviceKeys.length===1 ? 0.12 : 0.30;
  const laborBandLow = 0.15, laborBandHigh = 0.45;
  const structOk = laborPct>=laborBandLow && laborPct<=laborBandHigh && matPct>=matBandLow*0.7 && matPct<=matBandHigh*1.4;
  checks.push({ id:5, title:'Cost-structure sanity', value:`Crew payout ${(laborPct*100).toFixed(1)}% (${(laborBandLow*100)|0}–${(laborBandHigh*100)|0}%) · materials ${(matPct*100).toFixed(1)}% (${(matBandLow*100)|0}–${(matBandHigh*100)|0}%)`,
    status: structOk?'ok':'warn',
    solutions: structOk ? [] : ['Confirm the paint tier and room/elevation counts match reality', 'A very small or very large job can naturally skew this ratio — check the small-job advisory and crew-day checks too', 'If this is a recurring pattern, the underlying rates may need recalibration in Settings'] });

  // 6 — TN license threshold
  checks.push({ id:6, title:'TN license threshold', value: retail>=CONSTANTS.TN_LICENSE_THRESHOLD ? `${money(retail)} is at or over $25,000 — state contractor license required` : `${money(retail)} is under the $25,000 threshold`,
    status: retail>=CONSTANTS.TN_LICENSE_THRESHOLD ? 'info':'ok', solutions: [] });

  // 7 — small job advisory (only fires for the awkward middle: too big for a
  // solo visit, too small to load a crew day efficiently. Solo-mode jobs are
  // the intended small-job outcome now, not a problem to flag.)
  const awkwardMiddle = !pricing.soloMode && pricing.totalBaseHours < 30 && billableCrewDays>0 && billableCrewDays<1.5;
  if(pricing.soloMode){
    checks.push({ id:7, title:'Small-job advisory', value:`${money(retail)} — priced as a solo visit at a ${(CONSTANTS.SOLO_JOB_MARGIN*100).toFixed(0)}% margin, not run through a subbed crew`, status:'ok', solutions:[] });
  } else {
    checks.push({ id:7, title:'Small-job advisory', value: awkwardMiddle ? `${money(retail)} — too much scope for a solo visit, not quite enough to load a crew day efficiently` : `${money(retail)} is above the small-job threshold`,
      status: awkwardMiddle ? 'warn':'ok',
      solutions: awkwardMiddle ? ['Bundle another room or two into this visit to reach an efficient crew-day size', 'Scale it back under 16 hours of scope so it prices as a solo visit instead', 'Override the margin on the proposal screen and take it anyway, as a logged, deliberate exception'] : [],
      actions: awkwardMiddle ? [{label:'+ Add a room', action:'add-room'},{label:'Adjust margin', action:'goto-proposal'}] : [] });
  }

  return checks;
}

  const drafts = ESTIMATES.filter(e=>e.status!=='Won'&&e.status!=='Lost');
  const rows = ESTIMATES.slice().sort((a,b)=>b.createdAt-a.createdAt).map(e=>{
    const initials = (e.customer.name||'New Lead').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    const svc = activeServiceKeys(e).map(k=>k[0].toUpperCase()+k.slice(1)).join(' + ') || 'No services yet';
    return `<div class="estimate-row" data-action="open-estimate" data-id="${e.id}">
      <div class="initials">${initials||'—'}</div>
      <div class="info">
        <div class="name">${e.customer.name || 'Untitled estimate'}</div>
        <div class="meta">${svc} · ${new Date(e.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
      </div>
      <div class="status-chip status-${e.status.toLowerCase()}">${e.status}</div>
    </div>`;
  }).join('');
  return `
    <div class="topbar" style="justify-content:space-between;">
      <div class="brandmark"><img src="assets/mark-700.png" style="height:28px;width:auto;"><img src="assets/wordmark-1000.png" style="height:13px;width:auto;"></div>
      <button class="privatebtn" data-action="goto-settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008.6 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 003.6 8.6a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
    <div class="screen">
      <div class="hero-home">
        <img src="assets/mark-700.png" class="mark">

        <p>A defensible, line-itemed price before you leave the driveway — cost-up, market-checked, every time.</p>
        <button class="startbtn" data-action="new-estimate">${ICONS.plus} New estimate</button>
      </div>
      <div class="section-label">Estimates${drafts.length?` · ${drafts.length} in progress`:''}</div>
      ${rows || `<div class="empty-state">No estimates yet. Start one from the front door.</div>`}
    </div>`;
}

/* ---------------- SECTION HUB ---------------- */
function renderHub(){
  const keys = activeServiceKeys(CURRENT);
  const tabDef = { interior:'Interior', exterior:'Exterior', cabinets:'Cabinets' };
  return topbar(CURRENT.customer.name||'Estimate', 'Walkthrough', {privateBtn:true}) + `
    <div class="screen">
      <div class="tabbar">
        ${keys.map(k=>`<button class="${VIEW.sectionTab===k?'active':''}" data-action="set-tab" data-tab="${k}">${tabDef[k]}</button>`).join('')}
      </div>
      ${renderHubBody(keys)}
    </div>
    ${footerBar()}`;
}
function renderHubBody(keys){
  const tab = keys.includes(VIEW.sectionTab) ? VIEW.sectionTab : keys[0];
  VIEW.sectionTab = tab;
  if(tab==='interior'){
    const rooms = CURRENT.rooms;
    return `<div class="section-label">${rooms.length} room${rooms.length===1?'':'s'}</div>
      ${rooms.map(roomCardHtml).join('')}
      <button class="add-room-btn" data-action="add-room">${ICONS.plus} Add room</button>
      ${rooms.length>0 ? `<button class="btn btn-secondary" data-action="goto-review">Review &amp; price this estimate</button>`:''}`;
  }
  if(tab==='exterior'){
    return renderElevationsInline();
  }
  if(tab==='cabinets'){
    return renderCabinetsInline();
  }
}
function roomCardHtml(room){
  const t = roomTypeInfo(room.type);
  const {lines} = computeRoomLines(room, VIEW.tier);
  const hours = lines.reduce((s,l)=>s+l.hours,0);
  const [L,W] = room.dims;
  const preset = room.measuredBy==='preset';
  return `<div class="room-card" data-action="edit-room" data-id="${room.id}">
    <div class="ricon">${ICONS[t.icon]||ICONS.home}</div>
    <div class="rinfo">
      <div class="rname">${t.label}${preset?`<span class="preset-dot" title="Preset dimensions"></span>`:''}</div>
      <div class="rmeta">${L}×${W} ft <span class="dot"></span> ${room.texture} texture <span class="dot"></span> ${hours.toFixed(1)} hr</div>
    </div>
    <div class="chev">${ICONS.chev}</div>
  </div>`;
}

/* ---------------- EXTERIOR ---------------- */
function renderElevationsInline(){
  const elevs = CURRENT.elevations;
  const comp = CURRENT.extComponents;
  const activeCount = elevs.filter(e=>e.active).length;
  const enteredSqft = elevs.filter(e=>e.active).reduce((s,e)=>s+elevationArea(e),0);
  return `
    ${measurementReportCard(enteredSqft)}
    <div class="section-label">Elevations</div>
    ${elevs.map(e=>elevationCardHtml(e)).join('')}
    <div class="card">
      <div class="section-label" style="padding:0;">Components</div>
      ${EXT_COMPONENT_DEFS.map(def=>`
        <div class="surface-row"><div><div class="slabel">${def.label}</div><div class="ssub">${def.unit}</div></div>
          <input type="number" style="width:76px; text-align:right; border:1px solid var(--cf-line-strong); border-radius:8px; padding:8px; font-size:15px;" value="${comp[def.key]||0}" data-action="set-ext-comp" data-key="${def.key}">
        </div>`).join('')}
    </div>
    ${activeCount>0 ? `<button class="btn btn-secondary" data-action="goto-review">Review &amp; price this estimate</button>`:''}
  `;
}

const MEASUREMENT_PROVIDERS = {
  manual:   { label:'Tape / laser', url:null, priceNote:'No cost — hand-measured on-site' },
  eagleview:{ label:'EagleView Walls', url:'https://construction.eagleview.com/walls/', priceNote:'~$15\u2013$38 per report \u2014 remote, precise to 1/10 ft, separates siding from masonry' },
  hover:    { label:'HOVER', url:'https://hover.to', priceNote:'~$25 per scan \u2014 also builds a 3D model you can drop actual paint colors onto in front of the customer' },
};
function measurementReportCard(enteredSqft){
  const m = CURRENT.extMeasurement || (CURRENT.extMeasurement = {provider:'manual', reportRef:'', orderedAt:null, reportSqft:null});
  const provider = MEASUREMENT_PROVIDERS[m.provider] || MEASUREMENT_PROVIDERS.manual;
  const hasReportSqft = m.reportSqft!=null && m.reportSqft>0;
  let compareBanner = '';
  if(hasReportSqft && enteredSqft>0){
    const diffPct = Math.abs(enteredSqft-m.reportSqft)/m.reportSqft*100;
    const close = diffPct<=10;
    compareBanner = `<div class="banner ${close?'banner-ok':'banner-warn'}">${close?ICONS.check.replace(/#fff/g,'currentColor'):ICONS.warn.replace(/#fff/g,'currentColor')}<div>Elevations entered sum to <b>${Math.round(enteredSqft)} sq ft</b> vs. the report's <b>${Math.round(m.reportSqft)} sq ft</b> — ${diffPct.toFixed(0)}% apart. ${close?'Close enough to trust.':'Worth rechecking a wall length or height.'}</div></div>`;
  }
  return `<div class="card">
    <div class="section-label" style="padding:0;">Aerial measurement report</div>
    <div class="chiprow">
      ${Object.entries(MEASUREMENT_PROVIDERS).map(([k,v])=>`<div class="chip small ${m.provider===k?'selected':''}" data-action="set-ext-measure-provider" data-provider="${k}">${v.label}</div>`).join('')}
    </div>
    <div class="helptext">${provider.priceNote}</div>
    ${provider.url ? `<button class="btn btn-secondary btn-sm" data-action="open-measure-provider" data-url="${provider.url}" style="width:auto; align-self:flex-start;">Order via ${provider.label} ↗</button>` : ''}
    ${provider.url ? `
    <div class="row2">
      <div class="field"><label>Order / report reference</label><input type="text" id="ext-report-ref" value="${esc(m.reportRef)}" placeholder="Order #12345" data-action="set-ext-report-ref"></div>
      <div class="field"><label>Total wall sq ft from report</label><input type="number" id="ext-report-sqft" value="${m.reportSqft!=null?m.reportSqft:''}" placeholder="2,450" data-action="set-ext-report-sqft"></div>
    </div>
    <div class="helptext">Perch can't place the order or pull data automatically — no live integration. Order it on their site, then enter the total wall sq ft here as a cross-check against the elevation dimensions below.</div>
    ` : ''}
    ${compareBanner}
    ${pdfUploadSectionHtml()}
  </div>`;
}

function pdfUploadSectionHtml(){
  const ex = VIEW.pdfExtract;
  let resultsHtml = '';
  if(ex){
    if(ex.loading){
      resultsHtml = `<div class="helptext">Reading ${esc(ex.fileName)}…</div>`;
    } else if(ex.error){
      resultsHtml = `<div class="banner banner-warn">${ICONS.warn.replace(/#fff/g,'currentColor')}<div>Couldn't read that PDF (${esc(ex.error)}). Enter the numbers by hand instead.</div></div>`;
    } else {
      const totalChips = (ex.totalCandidates||[]).map((c,i)=>`<div class="chip small" data-action="use-pdf-total" data-value="${c.value}">${c.value.toLocaleString()} sq ft <span style="opacity:.6;">— "${esc(c.label)}"</span></div>`).join('');
      const elevKeys = Object.keys(ex.elevCandidates||{});
      const elevSummary = elevKeys.map(k=>`${k[0].toUpperCase()+k.slice(1)}: ${ex.elevCandidates[k].toLocaleString()} sq ft`).join(' · ');
      resultsHtml = `
        ${totalChips ? `<div class="helptext" style="font-weight:600; color:var(--cf-ink);">Found in ${esc(ex.fileName)} — tap to use:</div><div class="chiprow">${totalChips}</div>` : ''}
        ${elevKeys.length ? `<div class="helptext" style="margin-top:6px;">Per-elevation: ${elevSummary}</div><button class="btn btn-secondary btn-sm" data-action="use-pdf-elevations" style="width:auto; align-self:flex-start;">Fill in ${elevKeys.length} elevation${elevKeys.length===1?'':'s'} from report</button>` : ''}
        ${!totalChips && !elevKeys.length ? `<div class="banner banner-info">${ICONS.info.replace(/#fff/g,'currentColor')}<div>Read the PDF but didn't find a recognizable wall-area figure — the wording may not match what this scans for. Enter the number by hand instead.</div></div>` : ''}
      `;
    }
  }
  return `
    <div class="field" style="margin-top:4px;">
      <label>Or upload the report PDF</label>
      <input type="file" accept="application/pdf" id="report-pdf-input" data-action="upload-report-pdf">
      <div class="helptext">Scans the PDF text in your browser for a total wall area and per-elevation breakdown — nothing is uploaded anywhere. Best-effort text matching, not a guaranteed parse; always sanity-check the number it finds.</div>
    </div>
    ${resultsHtml}
  `;
}
function elevationCardHtml(e){
  const hasReportArea = e.areaOverride!=null;

/* -------------------------------------------------------------------------
   Aerial wall-report PDF reading — runs entirely client-side (pdf.js from
   CDN, loaded on first use). Best-effort text scan for a total wall area
   and a per-elevation breakdown; results are always presented as tappable
   candidates for the estimator to confirm, never auto-applied silently.
   ------------------------------------------------------------------------- */
let pdfJsLoadPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfJsLoadPromise) return pdfJsLoadPromise;
  pdfJsLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    script.onload = () => {
      try{
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        resolve(window.pdfjsLib);
      }catch(err){ reject(err); }
    };
    script.onerror = () => reject(new Error('couldn\u2019t load PDF reader'));
    document.head.appendChild(script);
  });
  return pdfJsLoadPromise;
}

async function extractPdfText(arrayBuffer){
  const pdfjsLib = await loadPdfJs();
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  let fullText = '';
  for(let i=1; i<=doc.numPages; i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return fullText;
}

function parseWallReportText(text){
  const totalPatterns = [
    /total\s+wall\s+area[:\s]*([\d,]+\.?\d*)\s*(?:sq\.?\s*ft|square\s+feet|sf)/gi,
    /total\s+walls?[:\s]*([\d,]+\.?\d*)\s*(?:sq\.?\s*ft|square\s+feet|sf)/gi,
    /wall\s+area[:\s]*([\d,]+\.?\d*)\s*(?:sq\.?\s*ft|square\s+feet|sf)/gi,
  ];
  const totalCandidates = [];
  totalPatterns.forEach(re=>{
    let m;
    while((m = re.exec(text)) !== null){
      const value = parseFloat(m[1].replace(/,/g,''));
      if(!totalCandidates.find(c=>c.value===value)) totalCandidates.push({ value, label: m[0].trim() });
    }
  });

  const elevPattern = /(front|right|back|left|rear)\s+elevation[:\s]*([\d,]+\.?\d*)\s*(?:sq\.?\s*ft|square\s+feet|sf)/gi;
  const elevCandidates = {};
  let em;
  while((em = elevPattern.exec(text)) !== null){
    let side = em[1].toLowerCase();
    if(side==='rear') side = 'back';
    elevCandidates[side] = parseFloat(em[2].replace(/,/g,''));
  }

  return { totalCandidates, elevCandidates };
}

async function handleReportPdfUpload(file){
  VIEW.pdfExtract = { fileName: file.name, loading: true };
  render();
  try{
    const buf = await file.arrayBuffer();
    const text = await extractPdfText(buf);
    const parsed = parseWallReportText(text);
    VIEW.pdfExtract = { fileName: file.name, loading:false, ...parsed };
  }catch(err){
    VIEW.pdfExtract = { fileName: file.name, loading:false, error: err.message || 'unknown error' };
  }
  render();
}


/* -------------------------------------------------------------------------
   §10.2 Offline signature — the PDF/proposal content is hashed (SHA-256) and
   the signature image, timestamp, and that hash are stored together, so the
   customer signs a specific document rather than a promise of one.
   ------------------------------------------------------------------------- */
let sigCtx = null, sigDrawing = false, sigLast = null;
function initSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = '#1A1A1A'; sigCtx.lineWidth = 2.5; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches && e.touches.length ? e.touches[0] : e;
    return { x:(t.clientX-rect.left)*(canvas.width/rect.width), y:(t.clientY-rect.top)*(canvas.height/rect.height) };
  }
  function start(e){ sigDrawing = true; sigLast = pos(e); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(sigLast.x, sigLast.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigLast = p; e.preventDefault(); }
  function end(){ sigDrawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSignaturePad(){
  const canvas = document.getElementById('sig-canvas');
  if(canvas && sigCtx) sigCtx.clearRect(0,0,canvas.width,canvas.height);
}
async function sha256Hex(str){
  if(window.crypto && window.crypto.subtle){
    const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  // fallback — not cryptographically meaningful, only for environments without SubtleCrypto
  let h = 0; for(let i=0;i<str.length;i++){ h = (Math.imul(31,h)+str.charCodeAt(i))|0; }
  return 'fallback-' + (h>>>0).toString(16);
}
async function saveSignature(){
  const canvas = document.getElementById('sig-canvas');
  if(!canvas) return;
  const keys = activeServiceKeys(CURRENT);
  const p = pricingForServices(CURRENT, keys, VIEW.tier, VIEW.marginOverride);
  const canonical = JSON.stringify({
    estimateId: CURRENT.id, customer: CURRENT.customer.name, address: CURRENT.customer.address,
    tier: VIEW.tier, retail: p.retail, services: keys, timestamp: Date.now(),
  });
  const hash = await sha256Hex(canonical);
  CURRENT.signature = { dataUrl: canvas.toDataURL('image/png'), hash, timestamp: Date.now(), tier: VIEW.tier, retail: p.retail };
  CURRENT.status = 'Won';
  VIEW.signatureOpen = false;
  persistEstimates();
  render();
  showToast('Signed and bound to this proposal — document hash recorded.');
}

function breakdownHtml(pricing, keys){
  // Allocates the FULL job cost (sub labor + materials, incl. sundries,
  // occupied protection, and tax, all of which are computed once at the
  // job level, not per service) proportionally across service lines by
  // each service's share of paint cost. Line items are then rescaled to
  // the final ROUNDED retail (not the pre-round raw figure) so they foot
  // to the total exactly, to the dollar — the rounding delta is absorbed
  // into the last line rather than left as a silent few-dollar gap on a
  // document a customer might actually add up.
  const totalPaintCost = pricing.paintCost;
  const lines = pricing.services.map(svc=>{
    const materialsShare = totalPaintCost>0 ? (svc.paintCost/totalPaintCost)*pricing.materialsCost : pricing.materialsCost/pricing.services.length;
    const rawRetail = (svc.subLabor + materialsShare)/(1-pricing.margin);
    return { name: svc.label, qty: `${svc.subHours.toFixed(1)} sub-hours`, rawRetail };
  });
  if(pricing.rrpLine>0){
    lines.push({ name:'RRP compliance (pre-1978)', qty:'Containment, HEPA, testing, disposal', rawRetail: pricing.rrpLine/(1-pricing.margin) });
  }
  const rawSum = lines.reduce((s,l)=>s+l.rawRetail,0);
  let allocated = 0;
  lines.forEach((l,i)=>{
    if(i<lines.length-1){ l.shown = Math.round(rawSum>0 ? (l.rawRetail/rawSum)*pricing.retail : pricing.retail/lines.length); allocated += l.shown; }
    else { l.shown = pricing.retail - allocated; } // last line absorbs the rounding remainder
  });
  return lines.map(l=>`<div class="lineitem"><div><div class="lname">${l.name}</div><div class="lqty">${l.qty}</div></div><div class="lprice">${money(l.shown)}</div></div>`).join('');
}
