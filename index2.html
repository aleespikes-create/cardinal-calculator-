/* =========================================================================
   Event handling — single delegated listener
   ========================================================================= */
function attachHandlers(){
  root.querySelectorAll('[data-action]').forEach(el=>{
    const action = el.getAttribute('data-action');
    if(action==='noop') return;
    const evt = (el.tagName==='INPUT' && (el.type==='number'||el.type==='text'||el.type==='range'||el.type==='file')) || el.tagName==='SELECT' || el.tagName==='TEXTAREA' ? 'change' : 'click';
    el.addEventListener(evt, (e)=>handleAction(action, el, e));
    if(el.tagName==='INPUT' && el.type==='range'){
      el.addEventListener('input', (e)=>handleAction(action, el, e, true));
    }
  });
  // customer field live-typing shouldn't lose focus — bind blur/change only, handled above
}

function handleAction(action, el, e, isLive){
  switch(action){
    case 'new-estimate': {
      CURRENT = blankEstimate();
      VIEW = { screen:'customer', sectionTab:'interior', roomEditingId:null, tier:'better', marginOverride:0 };
      render();
      break;
    }
    case 'open-estimate': {
      const id = el.getAttribute('data-id');
      CURRENT = ESTIMATES.find(x=>x.id===id);
      const keys = activeServiceKeys(CURRENT);
      VIEW = { screen: keys.length? 'hub':'services', sectionTab: keys[0]||'interior', roomEditingId:null, tier:'better', marginOverride:0 };
      render();
      break;
    }
    case 'back': {
      if(VIEW.screen==='private'){ go('review'); }
      else if(VIEW.screen==='workorder'){ go('private'); }
      else if(VIEW.screen==='roomList'){ go('hub', {sectionTab:'interior'}); }
      else if(VIEW.screen==='roomDetail'){ go('hub', {sectionTab:'interior'}); }
      else if(VIEW.screen==='customer'){ go('home'); }
      else if(VIEW.screen==='services'){ go('customer'); }
      else if(VIEW.screen==='review'){ go('hub'); }
      else if(VIEW.screen==='proposal'){ go('review'); }
      else if(VIEW.screen==='settings'){ go('home'); }
      else { go('home'); }
      break;
    }
    case 'goto-private': go('private'); break;
    case 'goto-settings': go('settings'); break;
    case 'goto-review': go('review'); break;
    case 'goto-proposal': go('proposal'); break;

    case 'save-customer': {
      CURRENT.customer.name = document.getElementById('f-name').value;
      CURRENT.customer.address = document.getElementById('f-address').value;
      CURRENT.customer.phone = document.getElementById('f-phone').value;
      CURRENT.customer.email = document.getElementById('f-email').value;
      CURRENT.customer.leadSource = document.getElementById('f-source').value;
      CURRENT.customer.homeSqft = document.getElementById('f-sqft').value;
      CURRENT.customer.yearBuilt = document.getElementById('f-year').value;
      const yr = parseInt(CURRENT.customer.yearBuilt);
      CURRENT.rrpRequired = !!yr && yr < 1978;
      CURRENT.rrpCleared = !CURRENT.rrpRequired;
      if(!ESTIMATES.includes(CURRENT)) ESTIMATES.push(CURRENT);
      persistEstimates();
      go('services');
      break;
    }
    case 'toggle-service': {
      const k = el.getAttribute('data-k');
      CURRENT.services[k] = !CURRENT.services[k];
      render();
      break;
    }
    case 'save-services': {
      CURRENT.globals.occupancy = document.getElementById('g-occupancy').value;
      CURRENT.globals.textureDefault = document.getElementById('g-texture').value;
      CURRENT.globals.hoaRequired = document.getElementById('g-hoa').checked;
      persistEstimates();
      const keys = activeServiceKeys(CURRENT);
      go('hub', {sectionTab:keys[0]});
      break;
    }
    case 'confirm-rrp': {
      const firm = document.getElementById('rrp-firm').checked;
      const sub = document.getElementById('rrp-sub').checked;
      const scope = document.getElementById('rrp-scope').checked;
      if(firm&&sub&&scope){ CURRENT.rrpCleared = true; render(); }
      break;
    }
    case 'close-rrp': { CURRENT.rrpRequired = false; CURRENT.rrpCleared = true; render(); break; }

    case 'set-tab': { VIEW.sectionTab = el.getAttribute('data-tab'); render(); break; }
    case 'add-room': go('roomList'); break;
    case 'pick-room-type': {
      const type = el.getAttribute('data-type');
      const room = blankRoom(type);
      const t = roomTypeInfo(type);
      room.texture = CURRENT.globals.textureDefault || t.texture;
      room.occupancy = CURRENT.globals.occupancy==='occupied_heavy' ? 'occupied_heavy' : (CURRENT.globals.occupancy||'occupied');
      CURRENT.rooms.push(room);
      persistEstimates();
      go('roomDetail', {roomEditingId:room.id, sectionTab:'interior'});
      break;
    }
    case 'edit-room': {
      go('roomDetail', {roomEditingId: el.getAttribute('data-id')});
      break;
    }
    case 'delete-room': {
      const id = el.getAttribute('data-id');
      CURRENT.rooms = CURRENT.rooms.filter(r=>r.id!==id);
      persistEstimates();
      go('hub', {sectionTab:'interior'});
      break;
    }
    case 'set-room-size': {
      const room = CURRENT.rooms.find(r=>r.id===VIEW.roomEditingId);
      const t = roomTypeInfo(room.type);
      room.sizeChip = el.getAttribute('data-size');
      room.dims = [...t.presets[room.sizeChip]];
      room.measuredBy = 'preset';
      render();
      break;
    }
    case 'set-room-manual': {
      const room = CURRENT.rooms.find(r=>r.id===VIEW.roomEditingId);
      room.measuredBy = 'manual';
      render();
      break;
    }
    case 'set-room-field': {
      const room = CURRENT.rooms.find(r=>r.id===VIEW.roomEditingId);
      room[el.getAttribute('data-field')] = el.getAttribute('data-val');
      render();
      break;
    }
    case 'toggle-room-field': {
      const room = CURRENT.rooms.find(r=>r.id===VIEW.roomEditingId);
      const f = el.getAttribute('data-field');
      room[f] = !room[f];
      render();
      break;
    }
    case 'step-room-field': {
      const room = CURRENT.rooms.find(r=>r.id===VIEW.roomEditingId);
      const f = el.getAttribute('data-field');
      const dir = parseInt(el.getAttribute('data-dir'));
      room[f] = Math.max(0, (room[f]||0)+dir);
      render();
      break;
    }

    case 'set-elev-field': {
      const id = el.getAttribute('data-id');
      const elev = CURRENT.elevations.find(x=>x.id===id);
      const field = el.getAttribute('data-field');
      const val = el.getAttribute('data-val') || el.value;
      elev[field] = (field==='length'||field==='height') ? parseFloat(val)||0 : val;
      render();
      break;
    }
    case 'clear-elev-area-override': {
      const id = el.getAttribute('data-id');
      const elev = CURRENT.elevations.find(x=>x.id===id);
      elev.areaOverride = null;
      render();
      break;
    }
    case 'set-ext-comp': {
      const key = el.getAttribute('data-key');
      CURRENT.extComponents[key] = parseFloat(el.value)||0;
      render();
      break;
    }
    case 'set-ext-measure-provider': {
      CURRENT.extMeasurement.provider = el.getAttribute('data-provider');
      render();
      break;
    }
    case 'open-measure-provider': {
      const url = el.getAttribute('data-url');
      window.open(url, '_blank', 'noopener');
      break;
    }
    case 'set-ext-report-ref': {
      CURRENT.extMeasurement.reportRef = el.value;
      break;
    }
    case 'set-ext-report-sqft': {
      CURRENT.extMeasurement.reportSqft = el.value ? parseFloat(el.value) : null;
      render();
      break;
    }
    case 'upload-report-pdf': {
      const file = el.files && el.files[0];
      if(file) handleReportPdfUpload(file);
      break;
    }
    case 'use-pdf-total': {
      const value = parseFloat(el.getAttribute('data-value'));
      CURRENT.extMeasurement.reportSqft = value;
      render();
      showToast('Report total applied.');
      break;
    }
    case 'use-pdf-elevations': {
      const ex = VIEW.pdfExtract;
      if(ex && ex.elevCandidates){
        Object.entries(ex.elevCandidates).forEach(([side, sqft])=>{
          const elev = CURRENT.elevations.find(x=>x.id===side);
          if(elev){ elev.areaOverride = sqft; elev.active = true; }
        });
      }
      render();
      showToast('Elevations filled in from the report.');
      break;
    }
    case 'set-cab-num': {
      const field = el.getAttribute('data-field');
      CURRENT.cabinets[field] = parseFloat(el.value)||0;
      render();
      break;
    }
    case 'set-cab-field': {
      CURRENT.cabinets[el.getAttribute('data-field')] = el.getAttribute('data-val');
      render();
      break;
    }
    case 'toggle-cab-more': { VIEW.cabShowMore = true; render(); break; }
    case 'toggle-cab-surcharges': { VIEW.cabShowSurcharges = true; render(); break; }
    case 'match-cab-openings': {
      CURRENT.cabinets.openings = parseInt(el.getAttribute('data-value'), 10);
      render();
      break;
    }

    case 'toggle-room-field': break; // handled above

    case 'set-margin-override': { VIEW.marginOverride = parseFloat(el.value); render(); break; }
    case 'set-margin-input': {
      const keys = activeServiceKeys(CURRENT);
      const basePricing = pricingForServices(CURRENT, keys, VIEW.tier, 0);
      const typedPct = parseFloat(el.value);
      if(!isNaN(typedPct)){ VIEW.marginOverride = typedPct - (basePricing.margin*100); }
      render();
      break;
    }

    case 'present-proposal': {
      CURRENT.status = 'Presented';
      persistEstimates();
      VIEW.presentedModal = true;
      render();
      showToast('Proposal marked Presented — 30-day price validity starts now.');
      break;
    }
    case 'save-settings': {
      const patch = {
        CONSTANTS: {
          MATERIALS_TAX_RATE: parseFloat(document.getElementById('s-tax').value)/100,
          SUNDRIES_PCT: parseFloat(document.getElementById('s-sundriespct').value)/100,
          SUNDRIES_MIN: parseFloat(document.getElementById('s-sundriesmin').value),
          OCCUPIED_PROTECTION_RATE: parseFloat(document.getElementById('s-occprotect').value),
          MINIMUM_JOB: parseFloat(document.getElementById('s-minjob').value),
          CREW_DAY_FLOOR: parseFloat(document.getElementById('s-crewfloor').value),
          MARGIN_HARD_FLOOR: parseFloat(document.getElementById('s-marginfloor').value)/100,
          TN_LICENSE_THRESHOLD: parseFloat(document.getElementById('s-tnthresh').value),
          SOLO_JOB_HOUR_THRESHOLD: parseFloat(document.getElementById('s-solohours').value),
          SOLO_JOB_MARGIN: parseFloat(document.getElementById('s-solomargin').value)/100,
        },
        SUB_RATES: {
          interior: parseFloat(document.getElementById('s-rate-interior').value),
          exterior: parseFloat(document.getElementById('s-rate-exterior').value),
          cabinets: parseFloat(document.getElementById('s-rate-cabinets').value),
        },
        MARGIN_ANCHORS: MARGIN_ANCHORS.map((pair,i)=>[pair[0], parseFloat(document.getElementById('s-anchor-'+i).value)/100]),
      };
      applySettingsPatch(patch);
      const fx = runFixtureCheck();
      VIEW.fixtureResult = fx;
      if(fx.pass){ persistSettings(); showToast('Settings saved — Appendix A fixture still in band.'); }
      render();
      break;
    }
    case 'restore-settings': {
      restoreDefaults();
      VIEW.fixtureResult = runFixtureCheck();
      persistSettings();
      render();
      showToast('Restored factory defaults.');
      break;
    }

    case 'goto-workorder': go('workorder'); break;
    case 'set-wo-lang': { VIEW.workOrderLang = el.getAttribute('data-lang'); render(); break; }
    case 'open-signature': { VIEW.signatureOpen = true; render(); break; }
    case 'close-signature': { VIEW.signatureOpen = false; render(); break; }
    case 'clear-signature': { clearSignaturePad(); break; }
    case 'save-signature': { saveSignature(); break; }
    case 'print-proposal': { window.print(); break; }

    default: break;
  }
  // handle toggles addressed with special __ prefixes (elevation active / cabinet booleans)
  if(action==='toggle-room-field'){ /* no-op, handled above */ }
}

// Special toggle handling for elevation active state and cabinet boolean toggles,
// since toggleHtml() is reused generically across contexts.
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action="toggle-room-field"]');
  if(el){
    const field = el.getAttribute('data-field');
    if(field && field.startsWith('__elev_')){
      const id = field.replace('__elev_','');
      const elev = CURRENT.elevations.find(x=>x.id===id);
      elev.active = !elev.active;
      render();
      return;
    }
    if(field && field.startsWith('__cab_')){
      const key = field.replace('__cab_','');
      CURRENT.cabinets[key] = !CURRENT.cabinets[key];
      render();
      return;
    }
  }
}, true);

function showToast(msg){
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--cf-ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88%;text-align:center;';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* -------------------------------------------------------------------------
   Persistence (window.storage — personal, per-user)
   ------------------------------------------------------------------------- */
async function persistEstimates(){
  try{
    if(window.storage){
      await window.storage.set('perch:estimates', JSON.stringify(ESTIMATES.map(stripFns)));
    }
  }catch(err){ /* storage unavailable — session-only, fine for a prototype */ }
}
function stripFns(e){ return JSON.parse(JSON.stringify(e)); }
async function loadEstimates(){
  try{
    if(window.storage){
      const res = await window.storage.get('perch:estimates');
      if(res && res.value){ ESTIMATES = JSON.parse(res.value); }
    }
  }catch(err){ ESTIMATES = []; }
}

(async function init(){
  await loadSettings();
  await loadEstimates();
  render();
})();
</script>
